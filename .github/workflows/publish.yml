name: Publish to npm

# Stages the release on npm via trusted publishing (OIDC, no stored token).
# It only goes live once a maintainer approves it on npmjs.com with 2FA.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check npm supports staged publishing (>= 11.15.0)
        run: |
          node -e 'const [maj, min] = process.argv[1].split(".").map(Number); if (maj < 11 || (maj === 11 && min < 15)) { console.error(`npm ${process.argv[1]} is too old for npm stage publish`); process.exit(1); }' "$(npm -v)"

      - name: Check release tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ] && [ "$TAG" != "@saasquatch/squatch-js@$version" ]; then
            echo "Release tag '$TAG' does not match package.json version '$version'" >&2
            exit 1
          fi

      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: Stage for maintainer approval
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then tag=next; else tag=latest; fi
          npm stage publish --provenance --access public --tag "$tag"
